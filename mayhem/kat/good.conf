# KAT fixture: exercises sections, nested sections, node lists, comments and value types.
totem {
	version: 2
	cluster_name: katcluster
	transport: knet
	token: 3000
	crypto_cipher: aes256
	crypto_hash: sha256
	interface {
		linknumber: 0
		knet_link_priority: 5
	}
}

logging {
	fileline: off
	to_stderr: yes
	to_logfile: no
	to_syslog: no
	debug: off
	logger_subsys {
		subsys: QUORUM
		debug: on
	}
}

quorum {
	provider: corosync_votequorum
	expected_votes: 3
	two_node: 0
}

nodelist {
	node {
		name: alpha
		nodeid: 1
		ring0_addr: 192.168.0.1
		ring1_addr: 192.168.1.1
	}
	node {
		name: beta
		nodeid: 2
		ring0_addr: 192.168.0.2
	}
	# trailing comment
	node {
		name: gamma
		nodeid: 3
		quorum_votes: 2
		ring0_addr: fd00::3
	}
}
